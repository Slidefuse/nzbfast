# nzbfast service configuration (nzbfast serve --config /etc/nzbfast/nzbfast.toml)
#
# nzbfast speaks the SABnzbd API: Sonarr, Radarr and Prowlarr use their built-in
# "SABnzbd" download client, pointed at `listen` with this API key.

listen = "0.0.0.0:8085"   # or several: "127.0.0.1:8085,172.18.0.1:8085"
# api_key = "..."         # full access; generated and kept in state_dir if not set
# nzb_key = "..."         # add-only key

state_dir = "/var/lib/nzbfast"                  # queue, history, stored NZBs
staging_dir = "/dev/shm/nzbfast"                # fast scratch where jobs are assembled (RAM or NVMe)
complete_dir = "/mnt/media/downloads/complete"  # finished jobs, in category folders

# Coming from SABnzbd? Import its servers, categories, API keys and complete_dir;
# anything set in this file takes precedence.
# sab_ini = "/path/to/sabnzbd.ini"

# Bytes held in staging (active downloads + jobs waiting to be moved). New jobs wait
# when it is used up, so a slow complete_dir throttles downloading instead of filling RAM.
staging_limit_gb = 32

# active_jobs = 256      # jobs downloading at once (small jobs need many to fill the pipe)
# depth = 8              # most pipelined requests per connection (fewer on slow connections)
# write_buffer_mb = 0    # MiB of finished chunks waiting for disk; 0 = 1/16 of RAM (256..4096)
# io_threads = 8
# mover_jobs = 2         # jobs moved to complete_dir at once
# mover_threads = 4      # copy threads per file
# history_keep = 20000
# ui_auth = true         # the web UI asks for the API key once (then sets a cookie)
# speed_limit_mbs = 0    # initial speed limit in MB/s (0 = unlimited)
# nic = "eth0"           # interface shown as "NIC" in the web UI (default: the busiest one)

# Usenet providers. Lower `prio` is tried first; higher ones (block accounts) only get
# what the others lack.
[[servers]]
name = "Main"
host = "news.example.com"
port = 563
tls = true
user = "username"
pass = "password"
conns = 50
prio = 0

# [[servers]]
# name = "Backup"
# host = "news.example.net"
# port = 563
# tls = true
# user = "username"
# pass = "password"
# conns = 20
# prio = 1

# With sab_ini, a [[servers]] entry with `match` adjusts the imported server whose name
# or host contains it (and `enable = false` drops it). `connect` dials another address
# (e.g. a TCP relay) while TLS still verifies `host`.
# [[servers]]
# match = "example"
# conns = 40
# connect = "198.51.100.7:5631"

# Categories (folders below complete_dir). Sonarr and Radarr pass theirs with each NZB.
[[categories]]
name = "tv"
dir = "tv"

[[categories]]
name = "movies"
dir = "movies"

# Rewrite reported paths for clients that mount the folders elsewhere, e.g. Sonarr in
# a container that sees /mnt/media/downloads as /downloads.
# [[path_map]]
# from = "/mnt/media/downloads"
# to = "/downloads"
