<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nzbfast feeder</title>
<style>
:root{
  --bg:#0a0c0f;--panel:#11151a;--panel2:#161b21;--line:#222a33;--text:#dbe2ea;--dim:#7d8896;--faint:#4a5562;
  --accent:#5ad1ff;--ok:#3ddc84;--warn:#ffb547;--bad:#ff5f5f;--violet:#b48cff;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f4f6f8;--panel:#ffffff;--panel2:#f7f9fb;--line:#e1e6ec;--text:#1b2430;--dim:#5e6b7a;--faint:#a3adb9;--accent:#0a84c6;--ok:#1f9d5a;--warn:#b7740a;--bad:#d33}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 var(--sans)}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px 40px}
.mono,td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font:700 15px var(--sans);letter-spacing:.02em}
.brand b{color:var(--accent)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font:600 11px var(--sans);letter-spacing:.03em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.pill.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.pill.vio{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 40%,transparent)}
.sp{flex:1}
.dim{color:var(--dim)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:6px 0 12px}
.card{padding:12px 14px;min-width:0}
.card h3,.sec h2{margin:0 0 6px;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.card .v{font:600 22px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .d{color:var(--dim);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9px}
.sec{padding:12px 14px;margin-bottom:12px}
.sec .head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:8px}
.sec .head h2{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:4px 10px;background:transparent;color:var(--dim);font:inherit;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--text)}
.seg button .c{color:var(--faint);margin-left:4px;font-family:var(--mono)}
input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 10px;min-width:0;width:220px;max-width:100%}
.tw{overflow-x:auto}
#jobwrap{max-height:70vh;overflow:auto}
#jobs thead th{position:sticky;top:0;background:var(--panel);z-index:1}
table{width:100%;border-collapse:collapse}
th{font:600 11px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{text-align:right;white-space:nowrap}
td.t{max-width:520px;word-break:break-word}
td.item{white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.rel{font-family:var(--mono);font-size:12px}
.note{color:var(--dim);font-size:12px;margin-top:2px}
.bar{height:4px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:4px;width:110px}
.bar i{display:block;height:100%;background:var(--accent)}
.chart{display:flex;align-items:flex-end;gap:2px;height:70px;margin-top:4px}
.chart div{flex:1;background:color-mix(in srgb,var(--accent) 70%,transparent);border-radius:2px 2px 0 0;min-height:1px;position:relative}
.chart div i{position:absolute;left:0;right:0;bottom:0;background:var(--ok);border-radius:2px 2px 0 0}
.axis{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:3px}
.legend{display:flex;gap:12px;color:var(--dim);font-size:12px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:-1px}
.log{font:12px/1.5 var(--mono);max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .WARNING{color:var(--warn)}.log .ERROR{color:var(--bad)}
.log .ts{color:var(--faint)}
.empty{color:var(--dim);padding:16px 8px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.grid2>*{min-width:0}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
@media (max-width:640px){
  #jobs thead{display:none}
  #jobs tr{display:flex;flex-wrap:wrap;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
  #jobs td{border:0;padding:0;max-width:none}
  #jobs td.t{order:-1;flex-basis:100%;word-break:break-all}
  #jobs td.n{text-align:left}
  #jobs td:last-child{flex-basis:100%}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">nzbfast <b>feeder</b></div>
  <span id="mode" class="pill">…</span>
  <span id="ixs"></span>
  <span class="sp"></span>
  <span class="dim" id="upd"></span>
  <a href="../">nzbfast →</a>
</header>

<div class="cards">
  <div class="panel card"><h3>Grabs, last hour</h3><div class="v" id="g1">–</div><div class="d" id="g24">–</div></div>
  <div class="panel card"><h3>nzbfast queue</h3><div class="v" id="qj">–</div><div class="d" id="qd">–</div><div class="meter"><i id="qm" style="width:0"></i></div></div>
  <div class="panel card"><h3>In progress</h3><div class="v" id="act">–</div><div class="d" id="actd">–</div></div>
  <div class="panel card"><h3>Imported</h3><div class="v" id="imp">–</div><div class="d" id="impd">–</div></div>
  <div class="panel card"><h3>Problems</h3><div class="v" id="bad">–</div><div class="d" id="badd">–</div></div>
  <div class="panel card"><h3>Wanted</h3><div class="v" id="want">–</div><div class="d" id="wantd">–</div></div>
</div>

<div class="grid2">
  <div class="panel sec">
    <div class="head"><h2>Last 24 hours</h2><span class="sp"></span>
      <div class="legend"><span style="--c:var(--accent)">grabbed</span><span style="--c:var(--ok)">imported</span></div></div>
    <div class="chart" id="chart"></div>
    <div class="axis"><span>24h ago</span><span>12h</span><span>now</span></div>
  </div>
  <div class="panel sec">
    <div class="head"><h2>Indexers</h2></div>
    <div id="ixtable"></div>
  </div>
</div>

<div class="panel sec">
  <div class="head">
    <h2>Retrieving</h2>
    <div class="seg" id="views">
      <button data-v="active" class="on">Active<span class="c" id="c-active"></span></button>
      <button data-v="done">Imported<span class="c" id="c-done"></span></button>
      <button data-v="problems">Problems<span class="c" id="c-problems"></span></button>
      <button data-v="all">All</button>
    </div>
    <span class="sp"></span>
    <input id="q" type="search" placeholder="Filter by title, show, indexer…">
  </div>
  <div class="tw" id="jobwrap"><table id="jobs">
    <thead><tr><th>Added</th><th>For</th><th>Release</th><th>Indexer</th><th style="text-align:right">Size</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div>

<div class="panel sec">
  <div class="head"><h2>Activity</h2><span class="sp"></span><span class="dim">newest first</span></div>
  <div class="log" id="log"></div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gb = b => b >= 1e12 ? (b/1e12).toFixed(2)+" TB" : (b/1e9).toFixed(1)+" GB";
const ago = t => { if (!t) return "–"; const s = Date.now()/1000 - t;
  return s < 60 ? Math.round(s)+"s ago" : s < 3600 ? Math.round(s/60)+"m ago" : s < 86400 ? (s/3600).toFixed(1)+"h ago" : Math.round(s/86400)+"d ago"; };
const hhmm = t => new Date(t*1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
let view = "active", data = null;

function statusCell(j) {
  const cls = {queued:"acc", importing:"vio", imported:"ok", failed:"bad", "import-failed":"bad", "import-rejected":"warn"}[j.status] || "";
  let label = j.status, extra = "";
  if (j.status === "queued") {
    if (j.stage) {
      label = j.stage.toLowerCase();
      if (j.stage !== "Completed") extra = `<div class="bar"><i style="width:${j.pct||0}%"></i></div><div class="note mono">${j.pct||0}%${j.eta && j.eta !== "0:00:00" ? " · " + esc(j.eta) : ""}</div>`;
      else label = "waiting to import";
    } else label = "queued";
  }
  const note = j.note ? `<div class="note">${esc(j.note)}</div>` : "";
  const when = j.done && j.status !== "queued" ? `<div class="note">${ago(j.done)}</div>` : "";
  return `<span class="pill ${cls}">${esc(label)}</span>${extra}${when}${note}`;
}

function render() {
  if (!data) return;
  const d = data, c = d.counts || {};
  $("mode").textContent = d.dry ? "dry run" : "live";
  $("mode").className = "pill " + (d.dry ? "warn" : "ok");
  $("upd").textContent = "updated " + hhmm(d.now);
  const now = d.now;
  $("ixs").innerHTML = d.indexers.map(ix => {
    const g = ix.grab_blocked_until > now, s = !ix.available;
    return `<span class="pill ${s ? "bad" : g ? "warn" : "ok"}" title="${s ? "searches paused" : g ? "NZB downloads throttled" : "ok"}">${esc(ix.name)}</span>`;
  }).join(" ");
  $("g1").textContent = d.grabs_1h;
  $("g24").textContent = `${d.grabs_24h} in 24h · ${gb(d.bytes_24h)}`;
  if (d.queue) {
    $("qj").textContent = d.queue.jobs + " jobs";
    $("qd").textContent = `${d.queue.gb.toFixed(0)} GB left · refills below ${d.queue.target_jobs} jobs / ${d.queue.target_gb} GB`;
    $("qm").style.width = Math.min(100, 100*Math.max(d.queue.jobs/d.queue.target_jobs, d.queue.gb/d.queue.target_gb)) + "%";
  }
  const act = (c.queued||0) + (c.importing||0);
  $("act").textContent = act;
  $("actd").textContent = `${c.queued||0} downloading/queued · ${c.importing||0} importing`;
  $("imp").textContent = c.imported || 0;
  $("impd").textContent = `${d.stats.imported} since start · ${ago(d.started).replace(" ago","")} uptime`;
  const bad = (c.failed||0) + (c["import-failed"]||0) + (c["import-rejected"]||0);
  $("bad").textContent = bad;
  $("badd").textContent = `${c.failed||0} download failed (retried) · ${(c["import-failed"]||0)+(c["import-rejected"]||0)} import`;
  $("want").textContent = d.wanted.movies + d.wanted.seasons;
  $("wantd").textContent = `${d.wanted.movies} movies · ${d.wanted.seasons} seasons · ${d.wanted.due} due for search`;
  $("c-active").textContent = act; $("c-done").textContent = c.imported || 0; $("c-problems").textContent = bad;

  const hg = new Array(24).fill(0), hi = new Array(24).fill(0);
  d.hourly_grabs.forEach(([h, n]) => { if (h >= 0 && h < 24) hg[h] = n; });
  d.hourly_imports.forEach(([h, n]) => { if (h >= 0 && h < 24) hi[h] = n; });
  const mx = Math.max(1, ...hg, ...hi);
  $("chart").innerHTML = hg.map((n, i) =>
    `<div style="height:${100*n/mx}%" title="${24-i}h ago: ${n} grabbed, ${hi[i]} imported"><i style="height:${n ? 100*Math.min(hi[i],n)/n : 0}%"></i></div>`).join("");

  $("ixtable").innerHTML = `<div class="tw"><table><thead><tr><th>Name</th><th>State</th><th style="text-align:right">Queries today</th></tr></thead><tbody>` +
    d.indexers.map(ix => {
      const st = !ix.available ? `<span class="pill bad">paused ${ix.blocked_until > now ? "until " + hhmm(ix.blocked_until) : "(daily cap)"}</span>`
        : ix.grab_blocked_until > now ? `<span class="pill warn">grabs throttled until ${hhmm(ix.grab_blocked_until)}</span>`
        : `<span class="pill ok">ok</span>`;
      return `<tr><td>${esc(ix.name)}</td><td>${st}</td><td class="n">${ix.queries_today}${ix.daily_queries ? " / " + ix.daily_queries : ""}</td></tr>`;
    }).join("") + `</tbody></table></div>`;

  const f = $("q").value.trim().toLowerCase();
  const rank = j => j.status === "importing" ? 1 : j.stage === "Downloading" || (j.stage && j.stage !== "Queued" && j.stage !== "Completed") ? 0 : j.stage === "Completed" ? 2 : 3;
  if (view === "active") d.jobs.sort((a, b) => rank(a) - rank(b) || a.added - b.added);
  const jobs = d.jobs.filter(j => !f || (j.title + " " + j.item + " " + j.indexer + " " + (j.note||"")).toLowerCase().includes(f));
  $("rows").innerHTML = jobs.length ? jobs.map(j => `<tr>
      <td class="mono" title="${new Date(j.added*1000).toLocaleString()}">${hhmm(j.added)}<div class="note">${ago(j.added)}</div></td>
      <td class="item" title="${esc(j.item)}">${esc(j.item)}<div class="note">${j.app === "radarr" ? "movie" : "series"}</div></td>
      <td class="t"><span class="rel">${esc(j.title)}</span></td>
      <td>${esc(j.indexer)}</td>
      <td class="n">${gb(j.size)}</td>
      <td>${statusCell(j)}</td></tr>`).join("")
    : `<tr><td colspan="6" class="empty">${f ? "No matches." : view === "active" ? "Nothing being retrieved right now." : "Nothing here yet."}</td></tr>`;

  $("log").innerHTML = d.events.map(([t, lvl, msg]) =>
    `<div class="${lvl}"><span class="ts">${new Date(t*1000).toLocaleTimeString()}</span> ${esc(msg)}</div>`).join("") || `<div class="empty">No activity yet.</div>`;
}

async function load() {
  try {
    const r = await fetch(`api/status?view=${view}&limit=${view === "active" ? 1000 : 500}`, {cache: "no-store"});
    if (r.ok) { data = await r.json(); render(); }
    else $("upd").textContent = "error " + r.status;
  } catch (e) { $("upd").textContent = "feeder unreachable"; }
}
$("views").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll("#views button").forEach(x => x.classList.toggle("on", x === b));
  load();
});
$("q").addEventListener("input", render);
load(); setInterval(load, 5000);
</script>
</body>
</html>
