[package]
name = "nzbfast"
version = "0.1.0"
edition = "2021"

[dependencies]
rustls = "0.23"
webpki-roots = "0.26"
rcgen = "0.13"
flate2 = "1"
memchr = "2"
crc32fast = "1"
libc = "0.2"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unrar = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
